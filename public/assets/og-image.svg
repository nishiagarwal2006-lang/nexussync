<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F19"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#0B0F19"/>
    </linearGradient>
    <linearGradient id="ogTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
    <linearGradient id="ogMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
    <filter id="ogGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56,189,248,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBgGrad)"/>
  <rect width="1200" height="630" fill="url(#ogGrid)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="rgba(56,189,248,0.05)"/>
  <circle cx="1100" cy="530" r="200" fill="rgba(129,140,248,0.05)"/>
  <circle cx="600" cy="315" r="250" fill="rgba(56,189,248,0.03)"/>
  
  <!-- Logo Mark -->
  <rect x="500" y="150" width="200" height="200" rx="40" fill="url(#ogMarkGrad)" opacity="0.9" filter="url(#ogGlow)"/>
  <path d="M550 315V265l50 50 50-50v50" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Title -->
  <text x="600" y="420" font-family="Inter, sans-serif" font-size="48" font-weight="900" fill="url(#ogTextGrad)" text-anchor="middle" filter="url(#ogGlow)">
    NexusSync AI
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="470" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#E5E7EB" text-anchor="middle">
    Industrial Product Intelligence Engine
  </text>
  
  <!-- Description -->
  <text x="600" y="510" font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#9CA3AF" text-anchor="middle">
    Multi-Agent AI Pipeline • Knowledge Graphs • Traceable Citations
  </text>
  
  <!-- Animated dots -->
  <circle cx="580" cy="540" r="4" fill="#34D399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="540" r="4" fill="#38BDF8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="540" r="4" fill="#818CF8">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>